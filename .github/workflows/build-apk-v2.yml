# Pocket Client 2: built on Zalith Launcher 2 (supports Minecraft 1.21 through 26.x).
# Checks out ZL2 at a pinned commit, applies launcher2/pocketclient.patch and builds an arm64 debug APK.
# Builds are published as pre-releases tagged v2-<code> so they never replace the "latest" release
# that the current (v1) app reads for its own updates. Same package and key as v1, so it installs over it.
name: Build Pocket Client 2 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "launcher2/**"
      - ".github/workflows/build-apk-v2.yml"

permissions:
  contents: write

env:
  # Upstream commit the patch was made against. Bump only together with a regenerated patch.
  ZL2_REF: d3bc11b28047307c56a01bacc1b8f84f939514d8
  ARCH: arm64
  ABI: arm64-v8a
  BASE_VERSION_CODE: 300000
  BASE_VERSION_NAME: 2.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v6

      - name: Checkout Zalith Launcher 2 (pinned)
        uses: actions/checkout@v6
        with:
          repository: ZalithLauncher/ZalithLauncher2
          ref: ${{ env.ZL2_REF }}
          path: zl2
          submodules: recursive

      # The debug key of Zalith Launcher 1 signs Pocket Client 1. Using it here lets Pocket Client 2
      # install as an update over the existing app instead of as a second app.
      - name: Fetch Pocket Client 1 signing key
        uses: actions/checkout@v6
        with:
          repository: ZalithLauncher/ZalithLauncher
          ref: ed8a5c873b25f19d08aef5bdfc1084fd9aff836c
          path: zl1
          sparse-checkout: ZalithLauncher/debug.keystore
          sparse-checkout-cone-mode: false

      - name: Apply Pocket Client patch
        run: |
          git -C zl2 apply "$GITHUB_WORKSPACE/launcher2/pocketclient.patch"
          cp zl1/ZalithLauncher/debug.keystore zl2/ZalithLauncher/debug.keystore

      - name: Set launcher version
        run: |
          code=$((BASE_VERSION_CODE + GITHUB_RUN_NUMBER))
          name="${BASE_VERSION_NAME}-pc.${GITHUB_RUN_NUMBER}"
          sed -i "s/^launcher_version_code=.*/launcher_version_code=${code}/; s/^launcher_version_name=.*/launcher_version_name=${name}/" zl2/ZalithLauncher/gradle.properties
          grep -n "^launcher_" zl2/ZalithLauncher/gradle.properties
          echo "VERSION_CODE=${code}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${name}" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: zl2
        run: |
          chmod +x gradlew
          bash "$GITHUB_WORKSPACE/.github/scripts/run-logged.sh" "Build Pocket Client 2" ./gradlew ZalithLauncher:assembleDebug -Darch=${ARCH} --stacktrace

      # Publishes the full APK plus a bsdiff patch from the previous build, and updates pc_update.json on the
      # "v2-update" release. The app downloads only the patch when it has the previous build installed.
      - name: Publish release and update info
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --break-system-packages bsdiff4
          apk=$(ls zl2/ZalithLauncher/build/outputs/apk/debug/*.apk | head -1)
          export NOTES="$(git log -1 --pretty=%s)"
          prev_args=""
          if gh release download v2-update -p pc_update.json -D prev 2>/dev/null; then
            prev_code=$(python3 -c "import json;print(json.load(open('prev/pc_update.json'))['code'])")
            if gh release download "v2-${prev_code}" -p "PocketClient2-${ABI}.apk" -D prev; then
              prev_args="prev/pc_update.json prev/PocketClient2-${ABI}.apk"
            fi
          fi
          python3 .github/scripts/publish-v2-update.py "$apk" release2 $prev_args
          gh release create "v2-${VERSION_CODE}" release2/PocketClient2-* \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Pocket Client 2 ${VERSION_NAME}" \
            --notes "Pocket Client 2 (Zalith Launcher 2 base, Minecraft 1.21 - 26.x). Installs as an update over Pocket Client. ${NOTES}"
          if ! gh release view v2-update >/dev/null 2>&1; then
            gh release create v2-update --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Pocket Client 2 update channel" \
              --notes "Holds pc_update.json for the in-app updater. Do not delete."
          fi
          gh release upload v2-update release2/pc_update.json --clobber

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: PocketClient2-${{ env.ARCH }}-apk
          path: zl2/ZalithLauncher/build/outputs/apk/debug/*.apk
